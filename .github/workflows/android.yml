name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "build_android.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Preparar la app
        run: python build_android.py web

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Íconos, versión y firma
        run: python build_android.py android
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Sincronizar plugins
        run: npx cap sync android

      - name: Llave de firma
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/migym.jks

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk "MiGym-v${{ github.run_number }}.apk"

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi Gym v${{ github.run_number }}
          body: "Descarga el archivo .apk de abajo e instálalo encima de la versión anterior."
          files: MiGym-v${{ github.run_number }}.apk
          make_latest: true
