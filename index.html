<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Mi Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --ink:#111113; --sub:#8A8A8E; --sep:#E5E5EA;
  --blue:#2F7BF5; --blueSoft:rgba(47,123,245,.12); --green:#30B158; --greenRow:rgba(48,177,88,.16); --red:#E5484D; --gold:#E6A817;
  --font:system-ui,-apple-system,"SF Pro Text","Roboto","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--surface:#161618;--surface2:#232326;--ink:#F5F5F7;--sub:#8E8E93;--sep:#2C2C2E;--blueSoft:rgba(47,123,245,.2);--greenRow:rgba(48,177,88,.22)}
}
:root[data-theme="dark"]{--bg:#000000;--surface:#161618;--surface2:#232326;--ink:#F5F5F7;--sub:#8E8E93;--sep:#2C2C2E;--blueSoft:rgba(47,123,245,.2);--greenRow:rgba(48,177,88,.22)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:600px;margin:0 auto}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--sep)}
.bar .in{max-width:600px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.bar h1{font-size:17px;font-weight:600;margin:0;text-align:center;flex:1}
.bar .side{min-width:72px;display:flex;align-items:center}
.bar .side.r{justify-content:flex-end}
.pill{background:var(--blue);color:#fff;font-weight:600;font-size:15px;border-radius:8px;padding:7px 14px}
.link{color:var(--blue);font-weight:600;font-size:15px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:24px;height:24px}

main{padding:0 0 140px}
.sec{background:var(--surface);margin-top:12px;border-top:1px solid var(--sep);border-bottom:1px solid var(--sep)}
.sec-h{font-size:13px;color:var(--sub);padding:18px 16px 6px;margin:0;font-weight:500}
.pad{padding:14px 16px}

/* Routine cards */
.routine{padding:14px 16px;border-top:1px solid var(--sep)}
.routine:first-of-type{border-top:none}
.routine .rt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.routine h3{margin:0;font-size:17px;font-weight:700}
.badge{font-size:12px;font-weight:600;color:var(--blue);background:var(--blueSoft);padding:3px 8px;border-radius:6px}
.routine p{margin:4px 0 12px;color:var(--sub);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:block;width:100%;border-radius:8px;padding:11px;font-weight:600;font-size:15px;text-align:center}
.btn.blue{background:var(--blue);color:#fff}
.btn.gray{background:var(--surface2);color:var(--ink)}
.btn.red{background:transparent;color:var(--red)}

/* Week strip */
.week{display:flex;justify-content:space-between;padding:6px 16px 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub);flex:1}
.wd i{width:34px;height:34px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;color:var(--sub)}
.wd.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.wd.today i{border-color:var(--blue);color:var(--blue)}
.months{display:flex;gap:8px;padding:0 16px 16px}
.mw{flex:1;border-radius:8px;background:var(--surface2);padding:9px 0;font-size:13px;font-weight:600;color:var(--sub)}
.mw.on{background:var(--green);color:#fff}
.mw small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
.hintline{color:var(--sub);font-size:12.5px;margin:0;padding:0 16px 14px}
.vid{color:var(--blue);font-weight:600;font-size:14px;margin-left:auto}
.metarow{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--sep)}
.metarow label{flex:1;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.metarow input,.metarow select{border:none;background:var(--surface2);border-radius:6px;padding:8px;font-size:15px;font-weight:600;color:var(--ink);width:100%}
.edate{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:10px}
.edate input{border:none;background:var(--surface2);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:14px}
.tok{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.tok input{border:none;background:var(--surface2);border-radius:8px;padding:11px 12px;font-size:15px}
.tok p{margin:0;font-size:13.5px;color:var(--sub)}
.tok ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--sub)}
.sync.err i{background:var(--red)}

/* Feed */
.post{padding:14px 16px;border-top:1px solid var(--sep)}
.post:first-child{border-top:none}
.post .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.post h3{margin:0;font-size:16px;font-weight:700}
.post time{color:var(--sub);font-size:13px}
.kpis{display:flex;gap:22px;margin:10px 0}
.kpi span{display:block;font-size:12px;color:var(--sub)}
.kpi b{font-size:15px;font-weight:600}
.post ul{list-style:none;margin:0;padding:0;font-size:14px;color:var(--sub)}
.post li{padding:2px 0}
.post li b{color:var(--ink);font-weight:500}
.more{color:var(--sub);font-size:13px;margin-top:8px}

/* Thumbnails */
.th{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--sub)}
.th svg{width:24px;height:24px}

/* Live workout */
.live{position:fixed;inset:0;z-index:40;background:var(--surface);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px);overscroll-behavior:contain}
.live.open{display:block}
.live .bar{top:0}
.stats{display:flex;gap:26px;padding:12px 16px;border-bottom:1px solid var(--sep)}
.stats div span{display:block;font-size:12px;color:var(--sub)}
.stats div b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.exb{padding:16px 0 10px;border-bottom:8px solid var(--bg)}
.exh{display:flex;align-items:center;gap:12px;padding:0 16px}
.exh .nm{flex:1;min-width:0}
.exh .nm button{color:var(--blue);font-weight:600;font-size:16.5px;text-align:left;line-height:1.25}
.exh .nm small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.tip{margin:10px 16px 0;font-size:14px;color:var(--ink);background:var(--surface2);border-radius:8px;padding:10px 12px;display:none}
.tip.open{display:block}
.tip a{color:var(--blue);font-weight:600;text-decoration:none;display:inline-block;margin-top:6px}
.goal{padding:8px 16px 0;font-size:13.5px;color:var(--sub)}
.goal b{color:var(--blue);font-weight:600}
.rest{padding:6px 16px 4px;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:6px}
.rest svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 44px;align-items:center;column-gap:8px;padding:0 16px}
.ghead{font-size:12px;font-weight:600;color:var(--sub);padding-top:8px;padding-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.ghead div{text-align:center}
.ghead div:nth-child(2){text-align:left}
.srow{padding-top:5px;padding-bottom:5px;transition:background .2s}
.srow.done{background:var(--greenRow)}
.sn{width:28px;height:28px;margin:0 auto;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px}
.srow.done .sn{background:transparent}
.prev{color:var(--sub);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
.prev:empty::before{content:"—"}
.cell input{width:100%;border:none;background:var(--surface2);border-radius:6px;padding:8px 2px;text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.srow.done .cell input{background:transparent}
.cell input::placeholder{color:var(--sub);font-weight:500}
.cell input:focus{outline:2px solid var(--blue)}
.ck{width:34px;height:34px;margin:0 auto;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:transparent}
.ck svg{width:20px;height:20px}
.srow.done .ck{background:var(--green);color:#fff}
.addset{margin:8px 16px 0;width:calc(100% - 32px)}
.mini{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:30;display:none;padding:0 10px 8px}
.mini.on{display:block}
.mini button{max-width:580px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--sep);border-radius:12px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.mini b{font-weight:600}
.mini span{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;background:var(--surface);border-top:1px solid var(--sep);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.timer.on{display:block}
.timer .in{max-width:600px;margin:0 auto}
.tbar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;background:var(--blue)}
.trow{display:flex;align-items:center;gap:8px}
.trow .clk{flex:1;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.trow button{background:var(--surface2);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.trow .skip{background:var(--blue);color:#fff}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--sub)}
nav.tabs svg{width:26px;height:26px}
nav.tabs button.on{color:var(--blue)}

/* Profile / charts */
.prof{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.prof h2{margin:0;font-size:20px}
.prof p{margin:2px 0 0;color:var(--sub);font-size:14px}
.trio{display:flex;border-top:1px solid var(--sep)}
.trio div{flex:1;padding:12px 16px}
.trio span{display:block;font-size:12px;color:var(--sub)}
.trio b{font-size:17px;font-weight:600}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;border-top:1px solid var(--sep)}
.exrow:first-child{border-top:none}
.exrow .nm{flex:1;min-width:0}
.exrow .nm b{display:block;font-weight:500;font-size:15.5px}
.exrow .nm span{font-size:13px;color:var(--sub)}
.chev{color:var(--sub);width:18px;height:18px}
.chart{display:block;width:100%;height:auto}
.records{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--sep)}
.records div{padding:12px 16px;border-bottom:1px solid var(--sep)}
.records div:nth-child(odd){border-right:1px solid var(--sep)}
.records span{display:block;font-size:12px;color:var(--sub)}
.records b{font-size:17px;font-weight:600}
.hrow{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--sep);font-size:14.5px}
.hrow span{color:var(--sub)}
.bwf{display:flex;gap:8px;padding:12px 16px}
.bwf input{flex:1;min-width:0;border:none;background:var(--surface2);border-radius:8px;padding:11px 12px;font-size:16px;font-weight:600}
.bwf button{width:auto;padding:11px 18px}
.empty{color:var(--sub);text-align:center;padding:24px 16px;font-size:14.5px}
.screen{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.screen.open{display:block}

/* Summary */
.sum{padding:28px 16px 10px;text-align:center}
.sum .big{font-size:28px;font-weight:800;margin:6px 0 4px}
.sum p{color:var(--sub);margin:0}
.prlist{list-style:none;margin:0;padding:0}
.prlist li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--sep);font-size:15px}
.prlist li:first-child{border-top:none}
.trophy{color:var(--gold);width:22px;height:22px;flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14.5px;z-index:80;display:none;max-width:90%;text-align:center}
.toast.on{display:block}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--sub)}
.sync.on i{background:var(--green)}
</style>
</head>
<body>
<header class="bar" id="topbar"><div class="in"><div class="side" id="barL"></div><h1 id="barT">Mi Gym</h1><div class="side r" id="barR"></div></div></header>
<main class="wrap" id="main"></main>

<section class="live" id="live" aria-label="Entreno en curso"></section>
<section class="screen" id="screen"></section>
<div class="mini" id="mini"><button id="resume"><b id="miniT">Entreno en curso</b><span id="miniClock">0:00</span></button></div>
<div class="timer" id="timer"><div class="in">
  <div class="tbar"><i id="tbar"></i></div>
  <div class="trow"><button id="tminus" aria-label="Restar 15 segundos">−15s</button><div class="clk" id="tclk">0:00</div><button id="tplus" aria-label="Sumar 15 segundos">+15s</button><button class="skip" id="tskip">Saltar</button></div>
</div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Rutina ===== */
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q + " tecnica correcta");
const DAYS = [
 {id:"L", name:"Lunes", title:"Torso A", ex:[
  ["press-banca","Press banca","pecho",8,12,150,"Escápulas juntas y abajo, pies firmes. Baja a la parte baja del pecho con los codos a unos 45°."],
  ["jalon-amplio","Jalón al pecho agarre amplio","espalda",8,12,150,"Pecho arriba; lleva la barra a la parte alta del pecho tirando con los codos. Sin balancearte."],
  ["press-hombro","Press de hombro en máquina","hombro",10,12,120,"Espalda pegada al respaldo; baja hasta que las manos queden a la altura de las orejas."],
  ["remo-mancuerna","Remo con mancuerna","espalda",8,12,120,"Espalda recta y paralela al piso; lleva la mancuerna hacia la cadera. Reps por brazo."],
  ["laterales","Elevaciones laterales","hombro",12,20,60,"Sube hasta la altura del hombro, codos un poco flexionados, sin impulso."],
  ["curl-mancuerna","Curl de bíceps con mancuerna","brazo",10,15,60,"Codos quietos pegados al cuerpo. Baja lento, 2–3 segundos."],
  ["triceps-polea","Tríceps en polea","brazo",10,15,60,"Codos fijos a los lados; solo se mueve el antebrazo."]]},
 {id:"M", name:"Martes", title:"Pierna A", ex:[
  ["goblet","Sentadilla goblet","pierna",8,12,150,"Mancuerna pegada al pecho; rodillas hacia la punta de los pies; muslos paralelos o más abajo."],
  ["prensa","Prensa","pierna",10,15,120,"La cadera nunca se despega del asiento. No bloquees las rodillas arriba."],
  ["curl-femoral","Curl femoral","pierna",10,15,90,"Cadera pegada al banco; sube controlado y baja lento."],
  ["extension","Extensión de cuádriceps","pierna",12,15,60,"Aprieta 1 segundo arriba. Sin golpes ni impulso."],
  ["pantorrilla","Pantorrilla","pierna",12,20,60,"Baja hasta estirar del todo y pausa 1 segundo abajo. Sin rebotar."],
  ["plancha","Plancha","abdomen",30,45,60,"Cuerpo en línea recta, glúteos apretados, sin dejar caer la cadera.","s"],
  ["elev-piernas","Elevaciones de piernas","abdomen",10,15,60,"Lumbar pegada al piso o al banco. Baja lento.","bw"]]},
 {id:"X", name:"Miércoles", title:"Full body ligero", light:true, ex:[
  ["press-banca-ligero","Press banca (ligero)","pecho",8,10,120,"Misma técnica del lunes. Termina pudiendo hacer 3 repeticiones más."],
  ["jalon-estrecho","Jalón agarre estrecho","espalda",10,12,120,"Manos más juntas: lleva los codos hacia las costillas."],
  ["rdl-mancuernas","Peso muerto rumano con mancuernas","pierna",10,12,120,"Cadera atrás, espalda recta, rodillas apenas flexionadas."],
  ["laterales","Elevaciones laterales","hombro",12,20,60,"Sube hasta la altura del hombro, codos un poco flexionados, sin impulso."],
  ["curl-polea","Curl de bíceps en polea","brazo",12,15,60,"Codos quietos; la polea mantiene tensión todo el recorrido."],
  ["triceps-cabeza","Extensión de tríceps sobre la cabeza","brazo",12,15,60,"De espaldas a la polea, codos al frente; estira bien atrás."]]},
 {id:"J", name:"Jueves", title:"Torso B", ex:[
  ["press-inclinado","Press inclinado con mancuernas","pecho",8,12,150,"Banco a 30–45°. Escápulas juntas; baja hasta la altura del pecho."],
  ["remo-maquina","Remo en máquina","espalda",8,12,120,"Pecho apoyado; lleva los codos atrás y aprieta la espalda 1 segundo."],
  ["aperturas","Aperturas en máquina o polea","pecho",12,15,60,"Brazos un poco flexionados y fijos, como abrazando un árbol."],
  ["face-pull","Face pull","hombro",12,20,60,"Cuerda a la altura de la cara; tira hacia las orejas separando las manos."],
  ["laterales","Elevaciones laterales","hombro",12,20,60,"Sube hasta la altura del hombro, codos un poco flexionados, sin impulso."],
  ["curl-martillo","Curl martillo","brazo",10,15,60,"Palmas mirándose entre sí, codos quietos."],
  ["triceps-cuerda","Tríceps con cuerda","brazo",10,15,60,"Abajo, separa las puntas de la cuerda hacia afuera."]]},
 {id:"V", name:"Viernes", title:"Pierna B", ex:[
  ["smith","Sentadilla en Smith","pierna",6,10,180,"El más pesado de la semana. Rodillas hacia la punta de los pies, baja a paralelo."],
  ["rdl-barra","Peso muerto rumano con barra","pierna",8,12,150,"Barra pegada a las piernas todo el recorrido. Si se redondea la espalda, baja el peso."],
  ["zancadas","Zancadas caminando","pierna",10,10,120,"Paso largo, torso derecho; la rodilla de atrás casi toca el piso. Reps por pierna."],
  ["curl-femoral","Curl femoral","pierna",10,15,90,"Cadera pegada al banco; sube controlado y baja lento."],
  ["pantorrilla","Pantorrilla","pierna",15,20,60,"Baja hasta estirar del todo y pausa 1 segundo abajo."],
  ["crunch-polea","Crunch en polea de rodillas","abdomen",12,15,60,"Encorva la espalda llevando el pecho hacia las rodillas. La cadera no se mueve."],
  ["elev-piernas","Elevaciones de piernas","abdomen",12,12,60,"Lumbar pegada al piso o al banco. Baja lento.","bw"]]}
].map(d=>({...d, ex:d.ex.map(a=>({id:a[0],n:a[1],g:a[2],lo:a[3],hi:a[4],rest:a[5],cue:a[6],kind:a[7]||"w"}))}));
const SETS=3;
const EX={}; DAYS.forEach(d=>d.ex.forEach(e=>{ if(!EX[e.id]) EX[e.id]=e; }));

/* ===== Íconos ===== */

  if(!CAP||!P.LocalNotifications) return;

/* ===== Sincronización con GitHub (Gist secreto) ===== */
const SKEY="gym-sync", GFILE="mi-gym-datos.json", GH="https://api.github.com";
let SY=(()=>{ try{ return JSON.parse(localStorage.getItem(SKEY))||{}; }catch(_){ return {}; } })();
let syncState={status:SY.token?"idle":"off",msg:""};
let syncing=false, syncAgain=false;
function saveSY(){ try{ localStorage.setItem(SKEY,JSON.stringify(SY)); }catch(_){} }
async function gh(path,opt={}){
  const headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+SY.token,"X-GitHub-Api-Version":"2022-11-28"};
  if(opt.body) headers["Content-Type"]="application/json";
  const r=await fetch(GH+path,{...opt,headers,cache:"no-store"});
  if(!r.ok){ const e=new Error("HTTP "+r.status); e.status=r.status; throw e; }
  return r.status===204?null:r.json();
}
function forCloud(x){ const c={...x}; delete c.active; return c; }
function mergeState(a,b){
  const del=new Set([...(a.deleted||[]),...(b.deleted||[])]);
  const newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b, older=newer===a?b:a;
  const ses=new Map(); [...(older.sessions||[]),...(newer.sessions||[])].forEach(s=>{ if(!del.has(s.id)) ses.set(s.id,s); });
  const body=new Map(); [...(older.body||[]),...(newer.body||[])].forEach(x=>body.set(x.date,x));
  return {...newer, v:2, sessions:[...ses.values()], body:[...body.values()],
    weekMarks:{...(older.weekMarks||{}),...(newer.weekMarks||{})}, deleted:[...del],
    active:a.active||null, updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0)};
}
async function syncNow(){
  if(!SY.token) return;
  if(syncing){ syncAgain=true; return; }
  if(!navigator.onLine){ syncState={status:"offline"}; renderSync(); return; }
  syncing=true; syncState={status:"syncing"}; renderSync();
  try{
    if(!SY.gist){
      const list=await gh("/gists?per_page=100");
      const f=(list||[]).find(g=>g.files&&g.files[GFILE]);
      if(f) SY.gist=f.id;
      else{ const c=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Mi Gym: datos de entreno (no borrar)",public:false,files:{[GFILE]:{content:JSON.stringify(forCloud(S))}}})}); SY.gist=c.id; }
      saveSY();
    }
    const g=await gh("/gists/"+SY.gist); const file=g.files&&g.files[GFILE]; let remote=null;
    if(file){ let txt=file.content; if(file.truncated){ txt=await (await fetch(file.raw_url,{cache:"no-store"})).text(); } try{ remote=JSON.parse(txt); }catch(_){} }
    if(remote&&Array.isArray(remote.sessions)){ S=mergeState(S,remote); saveLocal(); }
    await gh("/gists/"+SY.gist,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(forCloud(S))}}})});
    SY.at=Date.now(); saveSY(); syncState={status:"ok"};
    renderAll();
  }catch(e){
    if(e.status===404&&SY.gist){ delete SY.gist; saveSY(); }
    syncState={status:"error",msg:e.status===401?"El token no es válido o ya venció.":(e.status===403||e.status===404)?"El token no tiene permiso para gists.":"No se pudo conectar con GitHub."};
  }
  syncing=false; renderSync();
  if(syncAgain){ syncAgain=false; syncNow(); }
}
window.addEventListener("online",()=>syncNow());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncNow(); });

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id);
function iso(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fdate(s){ const [y,m,d]=s.split("-").map(Number); return d+" "+MES[m-1]; }
function todayDay(){ return {1:"L",2:"M",3:"X",4:"J",5:"V"}[new Date().getDay()]||null; }
function day(id){ return DAYS.find(d=>d.id===id); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function num(v){ if(v===""||v==null) return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }
function fk(n){ return n==null?"–":(Math.round(n*100)/100).toString().replace(".",","); }
function fmtVol(n){ return Math.round(n).toLocaleString("es-CO")+" kg"; }
function dur(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+"h "+m+"min" : m+":"+String(x).padStart(2,"0"); }
function durWords(ms){ const m=Math.round(ms/60000); return m>=60? Math.floor(m/60)+"h "+(m%60)+"min" : m+" min"; }
function weekStart(s){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); }
function monthWeeks(mk){ const [y,m]=mk.split("-").map(Number); const d=new Date(y,m-1,1,12); while(d.getDay()!==1) d.setDate(d.getDate()+1); const out=[]; while(d.getMonth()===m-1){ out.push(iso(d)); d.setDate(d.getDate()+7); } return out; }
function weekAuto(ws){ return new Set(S.sessions.filter(s=>weekStart(s.date)===ws).map(s=>s.day)).size>=5; }
function weekDone(ws){ const m=S.weekMarks[ws]; return m===undefined?weekAuto(ws):m; }
function weekLabel(ws){ const a=new Date(ws+"T12:00:00"), b=new Date(a); b.setDate(b.getDate()+6); return a.getDate()+"–"+b.getDate()+" "+MES[b.getMonth()]; }
function capi(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2400); }
function volOf(entries){ let v=0; Object.values(entries).forEach(a=>a.forEach(s=>{ if(s.done&&s.kg!=null&&s.reps!=null) v+=s.kg*s.reps; })); return v; }
function setsOf(entries){ let n=0; Object.values(entries).forEach(a=>a.forEach(s=>{ if(s.done) n++; })); return n; }
function prevFor(exId){
  const l=S.sessions.filter(s=>s.entries[exId]&&s.entries[exId].some(x=>x.kg!=null||x.reps!=null)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return l? l.entries[exId] : null;
}
function maxKg(exId){ let m=null; S.sessions.forEach(s=>(s.entries[exId]||[]).forEach(x=>{ if(x.kg!=null&&(m==null||x.kg>m)) m=x.kg; })); return m; }
function maxReps(exId){ let m=null; S.sessions.forEach(s=>(s.entries[exId]||[]).forEach(x=>{ if(x.reps!=null&&(m==null||x.reps>m)) m=x.reps; })); return m; }
function e1rm(kg,reps){ return kg*(1+reps/30); }
function unitLbl(e){ return e.kind==="s"?"seg":"reps"; }
function goal(e){
  const p=prevFor(e.id); const r=e.lo+(e.hi!==e.lo?"–"+e.hi:"");
  let t="";
  if(p){ const reps=p.map(s=>s.reps).filter(x=>x!=null); const kg=p.find(s=>s.kg!=null)?.kg;
    if(!reps.length) t="Usa el mismo peso y anota las reps";
    else if(reps.length>=SETS&&reps.every(x=>x>=e.hi)) t= e.kind==="w" ? "Sube el peso hoy" : (e.kind==="s"?"Súbele 10 segundos":"Hazlas más lentas o con peso");
    else if(reps.some(x=>x<e.lo)) t="Mantén "+fk(kg)+" kg";
    else t="Busca +1 rep por serie";
  }
  return `Meta ${SETS} × ${r} ${unitLbl(e)}${t?`: <b>${t}</b>`:""}`;
}

/* ===== Gráficas ===== */
function chart(pts){
  pts=pts.filter(p=>p.v!=null); if(!pts.length) return `<p class="empty">Sin datos todavía.</p>`;
  const W=340,H=170,L=34,R=12,T=16,B=26; const vs=pts.map(p=>p.v); let mn=Math.min(...vs), mx=Math.max(...vs); if(mn===mx){mn-=1;mx+=1;}
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const ticks=[mx,(mx+mn)/2,mn];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--sep)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${fk(Math.round(t*10)/10)}</text>`).join("")}
   <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--surface)" stroke="var(--blue)" stroke-width="2.5"/>`).join("")}
   <text x="${L}" y="${H-6}" font-size="11" fill="var(--sub)">${fdate(pts[0].date)}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--sub)">${fdate(pts[pts.length-1].date)}</text>`:""}</svg>`;
}
function openDetail(id){
  const e=EX[id]; const sess=S.sessions.filter(s=>s.entries[id]).sort((a,b)=>a.date.localeCompare(b.date));

  let best=null, rm=null; sess.forEach(s=>s.entries[id].forEach(x=>{ if(x.kg!=null&&x.reps!=null){ const v=e1rm(x.kg,x.reps); if(!rm||v>rm) rm=v; if(!best||x.kg*x.reps>best.kg*best.reps) best=x; } }));

   <div class="tip open" style="margin:0 16px 14px">${esc(e.cue)}<br><button class="vid" data-video="${e.id}" style="margin:8px 0 0">▶ Ver videos de técnica</button></div></div>
   ${e.kind==="w"?`<h2 class="sec-h">Peso más alto por sesión (kg)</h2><div class="sec"><div class="pad">${chart(heavy)}</div></div>`:""}
   <h2 class="sec-h">${e.kind==="s"?"Segundos totales por sesión":"Repeticiones totales por sesión"}</h2><div class="sec"><div class="pad">${chart(reps)}</div></div>

    <div><span>${e.kind==="w"?"Peso más alto":"Máximo en una serie"}</span><b>${e.kind==="w"?(m!=null?fk(m)+" kg":"–"):(mr!=null?mr+" "+unitLbl(e):"–")}</b></div>
    <div><span>1RM estimado</span><b>${rm&&e.kind==="w"?fk(Math.round(rm*10)/10)+" kg":"–"}</b></div>

   <h2 class="sec-h">Historial</h2><div class="sec">${sess.length?sess.slice().reverse().map(s=>`<div class="hrow"><span>${fdate(s.date)}</span><b>${s.entries[id].map(x=>(x.kg!=null&&e.kind==="w"?fk(x.kg)+"×":"")+(x.reps??"–")).join("  ")}</b></div>`).join(""):`<p class="empty">Todavía no has hecho este ejercicio.</p>`}</div>
   <div style="height:40px"></div></div>`;

/* ===== Entreno en vivo ===== */
let tickH=null;
function startWorkout(did){
  const d=day(did); const entries={};
  d.ex.forEach(e=>{ entries[e.id]=Array.from({length:SETS},()=>({kg:null,reps:null,done:false})); });
  S.active={id:"s-"+Date.now(),date:iso(),day:did,start:Date.now(),entries}; save(); openLive();
}
function switchRoutine(did){
  const A=S.active; const nd=day(did); if(!A||A.day===did) return;
  const lost=Object.entries(A.entries).filter(([k,a])=>!nd.ex.some(e=>e.id===k)&&a.some(s=>s.done)).length;
  if(lost&&!confirm("Vas a cambiar a "+nd.title+". Las series ya marcadas de ejercicios que no están en esa rutina se pierden. ¿Continuar?")){ const sel=$("lvDay"); if(sel) sel.value=A.day; return; }
  const entries={}; nd.ex.forEach(e=>{ entries[e.id]=A.entries[e.id]||Array.from({length:SETS},()=>({kg:null,reps:null,done:false})); });
  A.day=did; A.entries=entries; save(); openLive();
}
function prevTxt(e,p){ if(!p) return ""; if(e.kind==="w") return (p.kg!=null?fk(p.kg)+"kg":"")+(p.reps!=null?" × "+p.reps:""); return p.reps!=null?String(p.reps)+(e.kind==="s"?" s":""):""; }
function openLive(){
  const A=S.active; const d=day(A.day);
  $("live").innerHTML=`<header class="bar"><div class="in"><div class="side"><button class="icon-btn" id="minimize" aria-label="Minimizar entreno">${I.down}</button></div><h1>${esc(d.title)}</h1><div class="side r"><button class="pill" id="finish">Terminar</button></div></div></header>
   <div class="wrap"><div class="stats"><div><span>Duración</span><b id="lvDur">0:00</b></div><div><span>Volumen</span><b id="lvVol">0 kg</b></div><div><span>Series</span><b id="lvSets">0</b></div></div>

  $("live").classList.add("open"); updateStats(); clearInterval(tickH); tickH=setInterval(updateClock,1000); updateClock();
}
function exBlock(e){
  const A=S.active; const sets=A.entries[e.id]; const prev=prevFor(e.id)||[];
  const kgHead=e.kind==="w"?"Kg":""; const rHead=e.kind==="s"?"Seg":"Reps";
  return `<section class="exb" data-block="${e.id}">
   <div class="exh"><div class="th">${G[e.g]}</div><div class="nm"><button data-tip="${e.id}" aria-expanded="false">${esc(e.n)}</button><small>Toca el nombre para ver la técnica</small></div></div>
   <div class="tip" id="tip-${e.id}">${esc(e.cue)}<br><button class="vid" data-video="${e.id}" style="margin:8px 0 0">▶ Ver videos de técnica</button></div>
   <div class="goal">${goal(e)}</div>
   <div class="rest">${I.clock}<span>Descanso: ${Math.floor(e.rest/60)}min${e.rest%60?" "+(e.rest%60)+"s":""}</span><button class="vid" data-video="${e.id}">▶ Video</button></div>
   <div class="grid ghead"><div>Serie</div><div>Anterior</div><div>${kgHead}</div><div>${rHead}</div><div>✓</div></div>

function setRow(e,i,s,p){
  const ph=p||{};
  return `<div class="grid srow ${s.done?"done":""}" data-row="${e.id}:${i}">
   <div><div class="sn">${i+1}</div></div>
   <button class="prev" data-copy="${e.id}:${i}" aria-label="Copiar valores anteriores">${prevTxt(e,p)}</button>
   <div class="cell">${e.kind==="w"?`<input inputmode="decimal" data-f="kg" data-k="${e.id}:${i}" value="${s.kg!=null?fk(s.kg):""}" placeholder="${ph.kg!=null?fk(ph.kg):""}" aria-label="Kg serie ${i+1}">`:""}</div>
   <div class="cell"><input inputmode="numeric" data-f="reps" data-k="${e.id}:${i}" value="${s.reps??""}" placeholder="${ph.reps??(e.lo+"")}" aria-label="${e.kind==="s"?"Segundos":"Repeticiones"} serie ${i+1}"></div>

function updateClock(){ if(!S.active) return; const t=dur(Date.now()-S.active.start); const a=$("lvDur"); if(a) a.textContent=t; $("miniClock").textContent=t; }
function updateStats(){ if(!S.active) return; $("lvVol").textContent=fmtVol(volOf(S.active.entries)); $("lvSets").textContent=setsOf(S.active.entries); }
function closeLive(){ $("live").classList.remove("open"); renderAll(); }
function renderMini(){ const on=!!S.active && !$("live").classList.contains("open"); $("mini").classList.toggle("on",on); if(on){ $("miniT").textContent=day(S.active.day).title+" en curso"; updateClock(); } }

function toggleSet(key){
  const [id,i]=key.split(":"); const A=S.active; const s=A.entries[id][+i]; const e=EX[id];
  const row=document.querySelector(`[data-row="${key}"]`);
  if(!s.done){
    const kgIn=row.querySelector('[data-f="kg"]'), rIn=row.querySelector('[data-f="reps"]');
    if(s.kg==null && kgIn && kgIn.placeholder) { s.kg=num(kgIn.placeholder); kgIn.value=kgIn.placeholder; }
    if(s.reps==null && rIn.placeholder && prevFor(id)?.[+i]?.reps!=null){ s.reps=num(rIn.placeholder); rIn.value=rIn.placeholder; }
    if(s.reps==null){ toast("Escribe las "+(e.kind==="s"?"segundos":"repeticiones")); rIn.focus(); return; }
    if(e.kind==="w" && s.kg==null){ toast("Escribe el peso en kg"); kgIn.focus(); return; }
    s.done=true; row.classList.add("done"); row.querySelector(".ck").setAttribute("aria-pressed","true");
    const mk=maxKg(id), mr=maxReps(id);
    if(e.kind==="w" && mk!=null && s.kg>mk) toast("🏆 Nuevo récord: "+fk(s.kg)+" kg");
    else if(e.kind!=="w" && mr!=null && s.reps>mr) toast("🏆 Nuevo récord: "+s.reps+" "+unitLbl(e));
    const nx=A.entries[id][+i+1]; if(nx && nx.kg==null && s.kg!=null){ nx.kg=s.kg; const ni=document.querySelector(`[data-f="kg"][data-k="${id}:${+i+1}"]`); if(ni) ni.value=fk(s.kg); }
    startTimer(e.rest);
    buzz(30);
  } else { s.done=false; row.classList.remove("done"); row.querySelector(".ck").setAttribute("aria-pressed","false"); }
  save(); updateStats();
}
function finishWorkout(){
  const A=S.active; const entries={};
  Object.entries(A.entries).forEach(([k,a])=>{ const keep=a.filter(s=>s.done); if(keep.length) entries[k]=keep.map(s=>({kg:s.kg,reps:s.reps,done:true})); });
  if(!Object.keys(entries).length){ toast("Marca al menos una serie con ✓ para guardar"); return; }
  const prs=[]; Object.entries(entries).forEach(([k,a])=>{ const e=EX[k]; if(e.kind==="w"){ const m=maxKg(k); const top=Math.max(...a.map(s=>s.kg??0)); if(m!=null&&top>m) prs.push(e.n+": "+fk(top)+" kg"); } });
  const ms=Date.now()-A.start;
  S.sessions.push({id:A.id,date:A.date,day:A.day,ms,entries}); S.active=null; stopTimer(); clearInterval(tickH); save();
  $("live").classList.remove("open");
  const v=volOf(entries), n=setsOf(entries);
  const motos=v/150;
  $("screen").innerHTML=`<header class="bar"><div class="in"><div class="side"></div><h1>Entreno guardado</h1><div class="side r"><button class="link" id="closeSum">Listo</button></div></div></header>
   <div class="wrap"><div class="sum"><div style="font-size:40px">💪</div><div class="big">¡Buen trabajo, Angel!</div><p>${esc(day(A.day).title)}, ${fdate(A.date)}</p></div>
   <div class="sec"><div class="trio" style="border-top:none"><div><span>Tiempo</span><b>${durWords(ms)}</b></div><div><span>Volumen</span><b>${fmtVol(v)}</b></div><div><span>Series</span><b>${n}</b></div></div></div>
   ${v>=150?`<p class="sec-h" style="text-align:center;padding:14px 16px">Levantaste el equivalente a ${motos>=2?Math.floor(motos)+" motos":"una moto"} de 150 kg.</p>`:""}
   ${prs.length?`<h2 class="sec-h">Récords nuevos</h2><div class="sec"><ul class="prlist">${prs.map(p=>`<li>${I.trophy}${esc(p)}</li>`).join("")}</ul></div>`:""}
   <div class="pad"><button class="btn blue" id="closeSum2">Volver al inicio</button></div></div>`;
  $("screen").classList.add("open"); ui.tab="home"; renderAll();
}

/* ===== Temporizador ===== */
let T={end:0,total:0,h:null};
function startTimer(sec){ T.total=sec; T.end=Date.now()+sec*1000; $("timer").classList.add("on"); clearInterval(T.h); T.h=setInterval(tickT,250); tickT(); notifyAt(T.end); }
function tickT(){ const l=Math.max(0,Math.round((T.end-Date.now())/1000)); $("tclk").textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0"); $("tbar").style.width=(T.total?l/T.total*100:0)+"%"; if(l<=0){ stopTimer(); buzz(400); toast("Descanso terminado"); } }
function stopTimer(){ clearInterval(T.h); $("timer").classList.remove("on"); cancelNotif(); }
$("tminus").onclick=()=>{ T.end-=15000; T.total=Math.max(1,T.total-15); tickT(); if($("timer").classList.contains("on")) notifyAt(T.end); };
$("tplus").onclick=()=>{ T.end+=15000; T.total+=15; tickT(); notifyAt(T.end); };
$("tskip").onclick=stopTimer;

async function exportData(){
  const txt=JSON.stringify(forCloud(S),null,1), name="mi-gym-respaldo-"+iso()+".json";
  if(CAP&&P.Filesystem&&P.Share){
    try{ const w=await P.Filesystem.writeFile({path:name,data:txt,directory:"CACHE",encoding:"utf8"}); await P.Share.share({title:"Respaldo Mi Gym",files:[w.uri],dialogTitle:"Guardar respaldo"}); }
    catch(e){ if(!/cancel/i.test((e&&e.message)||"")) toast("No se pudo exportar"); }
    return;
  }
  const blob=new Blob([txt],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast("Respaldo descargado");
}
/* ===== Eventos ===== */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a"); if(!b) return; const ds=b.dataset;
  if(ds.tab){ ui.tab=ds.tab; window.scrollTo(0,0); renderAll(); return; }
  if(ds.start){ startWorkout(ds.start); return; }
  if(ds.resume||b.id==="resume"){ openLive(); renderMini(); return; }
  if(b.id==="minimize"){ closeLive(); return; }
  if(b.id==="finish"){ finishWorkout(); return; }
  if(b.id==="discard"){ if(confirm("¿Descartar este entreno? Se pierde lo anotado hoy.")){ S.active=null; stopTimer(); clearInterval(tickH); save(); closeLive(); } return; }
  if(ds.tip){ const t=$("tip-"+ds.tip); const o=t.classList.toggle("open"); b.setAttribute("aria-expanded",o); return; }
  if(ds.ck){ toggleSet(ds.ck); return; }
  if(ds.copy){ const [id,i]=ds.copy.split(":"); const p=prevFor(id)?.[+i]; if(!p) return; const s=S.active.entries[id][+i];
    if(p.kg!=null){ s.kg=p.kg; const k=document.querySelector(`[data-f="kg"][data-k="${ds.copy}"]`); if(k) k.value=fk(p.kg); }
    if(p.reps!=null){ s.reps=p.reps; document.querySelector(`[data-f="reps"][data-k="${ds.copy}"]`).value=p.reps; }
    save(); return; }
  if(ds.add){ const id=ds.add; const a=S.active.entries[id]; const last=a[a.length-1]; a.push({kg:last?.kg??null,reps:null,done:false}); save();
    const e=EX[id]; const prev=prevFor(id)||[]; document.querySelector(`[data-rows="${id}"]`).insertAdjacentHTML("beforeend",setRow(e,a.length-1,a[a.length-1],prev[a.length-1])); return; }
  if(ds.wk){ S.weekMarks[ds.wk]=!weekDone(ds.wk); save(); renderAll(); return; }
  if(ds.del){ if(confirm("¿Borrar este entreno?")){ S.sessions=S.sessions.filter(s=>s.id!==ds.del); S.deleted.push(ds.del); save(); renderAll(); } return; }
  if(ds.detail){ openDetail(ds.detail); return; }
  if(b.id==="closeDetail"||b.id==="closeSum"||b.id==="closeSum2"){ $("screen").classList.remove("open"); return; }
  if(b.id==="exportBtn"){ exportData(); return; }
  if(ds.video){ openExt(YT(EX[ds.video].n)); return; }
  if(ds.switch){ if(confirm("¿Cambiar el entreno en curso a "+day(ds.switch).title+"?")){ switchRoutine(ds.switch); } return; }
  if(b.id==="tokNew"){ openExt("https://github.com/settings/tokens/new?scopes=gist&description=Mi%20Gym%20app"); return; }
  if(b.id==="tokSave"){ const v=($("tokIn").value||"").trim(); if(v.length<20){ toast("Pega el token completo"); return; }
    SY={token:v}; saveSY(); toast("Conectando…");
    gh("/user").then(u=>{ SY.login=u.login; saveSY(); syncNow(); }).catch(e=>{ SY={}; saveSY(); renderSync(); toast(e.status===401?"Ese token no es válido":"No se pudo conectar con GitHub"); });
    return; }
  if(b.id==="syncGo"){ syncNow(); return; }
  if(b.id==="tokOff"){ if(confirm("¿Desconectar la sincronización? Tus datos siguen en el teléfono y en tu Gist.")){ SY={}; saveSY(); syncState={status:"off"}; renderSync(); } return; }
  if(b.id==="importBtn"){ $("importIn").click(); return; }
  if(b.id==="bwAdd"){ const v=num($("bwIn").value); if(v==null||v<25||v>250){ toast("Escribe tu peso en kg, por ejemplo 55,5"); return; } const d=iso(); S.body=S.body.filter(x=>x.date!==d); S.body.push({date:d,kg:v}); save(); renderAll(); toast("Peso guardado"); return; }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="lvDate"&&S.active&&t.value){ S.active.date=t.value; save(); return; }
  if(t.id==="lvDay"&&S.active){ switchRoutine(t.value); return; }
  if(t.dataset&&t.dataset.sdate&&t.value){ const s=S.sessions.find(x=>x.id===t.dataset.sdate); if(s){ s.date=t.value; save(); renderAll(); toast("Fecha actualizada"); } return; }
  if(ev.target.id!=="importIn"||!ev.target.files[0]) return;
  const f=ev.target.files[0]; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.sessions)) throw 0;
    if(!confirm("Esto reemplaza los datos de este teléfono con los del respaldo ("+d.sessions.length+" entrenos). ¿Continuar?")) return;
    const keep=S.active; S=d; S.weekMarks=S.weekMarks||{}; S.deleted=S.deleted||[]; S.active=keep||null; save(); renderAll(); toast("Datos importados"); }

  r.readAsText(f); ev.target.value="";
});
document.addEventListener("input",ev=>{
